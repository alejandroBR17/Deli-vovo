<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#D61F1F">
  <title>Sem conexão | Delícias da Vovó</title>
  <style>
    :root{color-scheme:light dark;--paper:#fff8ef;--ink:#30231e;--card:#fff;--border:#eadbd0}
    @media(prefers-color-scheme:dark){:root{--paper:#191b20;--ink:#fff3e8;--card:#26292f;--border:#49413b}}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif}
    main{width:100%;max-width:440px;padding:28px;background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:0 16px 48px #0002}
    .brand{color:#d64232;font-weight:750}h1{font-size:26px;line-height:1.25}p{line-height:1.6}a{display:block;padding:14px;text-align:center;background:#b72e25;color:#fff;border-radius:14px;font-weight:700;text-decoration:none}a:focus-visible{outline:3px solid #e8a348;outline-offset:4px}
  </style>
</head>
<body><main><p class="brand">Delícias da Vovó Grazy</p><h1>Vamos reconectar?</h1><p>Você está sem conexão. Conecte-se à internet para consultar a loja, enviar ou acompanhar pedidos.</p><p>Nenhum pedido pode ser enviado por esta tela.</p><a href="/">Tentar novamente</a></main></body>
</html>
